name: Build Windows EXE + Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download mtkclient
        run: |
          curl -L -o mtk.zip https://github.com/bkerler/mtkclient/archive/refs/heads/main.zip
          tar -xf mtk.zip
          Move-Item mtkclient-main mtkclient
        shell: pwsh

      - name: Install mtkclient requirements
        run: |
          pip install -r mtkclient/requirements.txt
        shell: pwsh

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed ^
            --name "AndroidTool" ^
            --add-data "mtkclient;mtkclient" ^
            main.py
        shell: cmd

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: AndroidTool-Portable
          path: dist/AndroidTool/

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: AndroidTool-Setup
          path: installer/Output/AndroidTool-Setup.exe